name: Checks

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-checks:
    name: Repository Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check whitespace
        run: git diff --check
      - name: Compile retained Python tools
        run: python -m compileall -q tools
      - name: Validate Murmur2 vectors
        run: python tools/validate_murmur2.py
      - name: Test retail evidence contract
        run: python tools/test_retail_protocol_caller.py
      - name: Regenerate and compare dependency catalogs
        run: |
          python tools/build_vtable_method_names.py
          python tools/build_external_dependency_ledger.py
      - name: Check generated catalog diff
        run: git diff --exit-code
      - name: Validate repository
        run: python tools/validate_repo.py

  clang-format:
    name: Clang Format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Clang Format
        run: python -m pip install clang-format==22.1.8
      - name: Check C++ formatting
        run: >-
          git ls-files -z -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh'
          '*.hpp' '*.hxx' |
          xargs -0 clang-format --dry-run --Werror
